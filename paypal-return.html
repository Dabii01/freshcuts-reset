
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Freshcuts | PayPal Confirmation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #F4EBD7;
      color: #30251F;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 25px #00000012;
    }

    h1 {
      color: #991919;
      font-size: 25px;
    }

    p {
      line-height: 1.6;
      color: #74695F;
    }

    .status {
      background: #FFF3DA;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      color: #8A6200;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FRESH CUTS</h1>
    <h2>PayPal Approval Received</h2>

    <p>
      Thank you for completing the PayPal
      approval step.
    </p>

    <div class="status">
      Payment verification is still required.
    </div>

    <p>
      Return to the Freshcuts app to verify
      your payment and confirm your order.
    </p>

    <p>
      Do not make another payment while
      verification is pending.
    </p>
  </div>
</body>
</html>
