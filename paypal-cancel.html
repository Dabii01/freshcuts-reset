
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Freshcuts | PayPal Cancelled</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #F4EBD7;
      color: #30251F;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 25px #00000012;
    }

    h1 {
      color: #991919;
    }

    p {
      color: #74695F;
      line-height: 1.6;
    }

    .notice {
      padding: 14px;
      background: #FBE5E5;
      border-radius: 8px;
      color: #991919;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FRESH CUTS</h1>
    <h2>PayPal Checkout Cancelled</h2>

    <div class="notice">
      You did not complete PayPal approval.
    </div>

    <p>
      Return to the Freshcuts app to review
      your order or choose another payment
      method.
    </p>

    <p>
      Your order may still be awaiting
      cancellation in Freshcuts.
    </p>
  </div>
</body>
</html>
